name: CoreDeck CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pre-Stage Leak & Quarantine Audit
        run: |
          MATCHED=$(git ls-files | grep -E -i '(\.env|premium|local|secret|credentials|license-key)' || true)
          if [ -n "$MATCHED" ]; then
            echo "::error::Sensitive or air-gapped files detected in repository index: $MATCHED"
            exit 1
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore CoreDeck.slnx

      - name: Build Solution
        run: dotnet build CoreDeck.slnx --no-restore --configuration Release

      - name: Run Automated Unit Tests
        run: dotnet test CoreDeck.slnx --no-build --configuration Release --verbosity normal
